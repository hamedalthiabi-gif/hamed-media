name: مهام Buffer (حذف أو مسودة)

on:
  push:
    branches: [main]
    paths: [agent/buffer_jobs.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buffer-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تنفيذ المهام
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 agent/buffer_jobs.py
      - name: حفظ السجل
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add agent/buffer_jobs.json
          git diff --cached --quiet || (git commit -m "مهام Buffer $(TZ=Asia/Riyadh date +'%Y-%m-%d %H:%M')" && git pull --rebase origin main && git push)
