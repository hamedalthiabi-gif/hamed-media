name: جلب تفاعل Buffer

on:
  schedule:
    - cron: '0 3 * * 0'   # الأحد 6:00 صباحًا بتوقيت الرياض، قبل التحليل الأسبوعي
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: جلب المنشورات المرسلة
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 agent/buffer_sent.py
      - name: حفظ
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add agent/engagement
          git diff --cached --quiet || (git commit -m "جلب تفاعل Buffer $(TZ=Asia/Riyadh date +'%Y-%m-%d')" && git pull --rebase origin main && git push)
