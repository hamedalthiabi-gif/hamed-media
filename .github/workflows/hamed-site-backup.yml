name: hamed-site-backup
on:
  workflow_dispatch:
  push:
    paths: [ "hamed-site/files.txt" ]
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download live site files
        run: |
          mkdir -p hamed-site/live
          for p in $(cat hamed-site/files.txt); do
            mkdir -p "hamed-site/live$(dirname "$p")"
            curl -fsSL --retry 3 "https://hamedalthiabi.com$p" -o "hamed-site/live$p"
          done
          ls -R hamed-site/live | head -50
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add hamed-site/live
          git commit -m "نسخة احتياطية من موقع حامد الذيابي" || echo "no changes"
          git pull --rebase && git push
