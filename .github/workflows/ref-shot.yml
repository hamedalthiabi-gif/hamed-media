name: ref-shot
on:
  workflow_dispatch:
  push:
    paths: [ "refshots/urls.txt" ]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Screenshot
        run: |
          cat > shot.js <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          (async()=>{const b=await chromium.launch();const urls=fs.readFileSync('refshots/urls.txt','utf8').split('\n').filter(Boolean);
          for(const line of urls){const [name,url]=line.split(' ');
            const p=await b.newPage({viewport:{width:1440,height:900}});
            try{await p.goto(url,{waitUntil:'networkidle',timeout:60000})}catch(e){}
            await p.waitForTimeout(4000);
            await p.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=500){scrollTo(0,y);await new Promise(r=>setTimeout(r,250))}scrollTo(0,0)});
            await p.waitForTimeout(2500);
            await p.screenshot({path:`refshots/${name}.png`,fullPage:true});
            fs.writeFileSync(`refshots/${name}.css.txt`,await p.evaluate(()=>{const cs=e=>getComputedStyle(e);const o=[];document.querySelectorAll('section,header,footer,h1,h2,h3,h4,p,a.btn,button').forEach((e,i)=>{if(i>160)return;const s=cs(e);o.push(e.tagName+'.'+String(e.className).slice(0,40)+' | font:'+s.fontFamily.split(',')[0]+' '+s.fontSize+' '+s.fontWeight+' lh:'+s.lineHeight+' | color:'+s.color+' bg:'+s.backgroundColor+' | pad:'+s.padding+' | '+(e.textContent||'').trim().slice(0,40).replace(/\s+/g,' '))});return o.join('\n')}));
            await p.close()}
          await b.close()})();
          JS
          node shot.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add refshots && git commit -m "لقطات مواقع مرجعية" || true
          git pull --rebase && git push
