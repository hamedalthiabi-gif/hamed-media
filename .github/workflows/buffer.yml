name: جدولة المنشورات في Buffer

on:
  push:
    branches: [main]
    paths: [agent/queue.json]
  schedule:
    - cron: '25 3 * * *'   # 6:25 صباحًا بتوقيت الرياض
    - cron: '25 15 * * *'  # 6:25 مساءً بتوقيت الرياض
  workflow_dispatch:
    inputs:
      check:
        description: 'اختبار المفتاح فقط دون نشر'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: buffer-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: اختبار المفتاح
        if: ${{ inputs.check }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 agent/buffer_publish.py check
      - name: جدولة
        if: ${{ !inputs.check }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 agent/buffer_publish.py
      - name: حفظ السجل
        if: ${{ always() && !inputs.check }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add agent/buffer_scheduled.json
          git diff --cached --quiet || (git commit -m "جدولة Buffer $(TZ=Asia/Riyadh date +'%Y-%m-%d %H:%M')" && git pull --rebase origin main && git push)
