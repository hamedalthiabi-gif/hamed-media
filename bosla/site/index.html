<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="بوصلة: المرجع التعليمي للعاملين في القطاع غير الربحي">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* Bosla standalone runtime: provides the same window.claude.use() surface the page expects,
   backed by Supabase (docs table + auth). Without config, the site runs read-only with its built-in content. */
(function(){
  var cfg = window.BOSLA_CONFIG || {};
  var sb = (cfg.url && cfg.anonKey && window.supabase) ? window.supabase.createClient(cfg.url, cfg.anonKey) : null;
  var session = null, uid = null, adminP = null;
  var listeners = {}; // collection -> [{id|null, fn}]

  function snapOf(rows){ return { docs: rows.map(function(r){ return { id: r.id, data: function(){ return r.data; } }; }) }; }
  async function fetchCol(c){ var r = await sb.from("docs").select("id,data").eq("collection", c); if (r.error) throw r.error; return r.data || []; }
  async function notify(c){
    var ls = listeners[c]; if (!ls || !ls.length) return;
    var rows; try { rows = await fetchCol(c); } catch(e) { ls.forEach(function(l){ l.err && l.err(e); }); return; }
    ls.forEach(function(l){
      if (l.id == null) l.fn(snapOf(rows));
      else { var row = rows.find(function(r){ return r.id === l.id; }); l.fn({ id: l.id, exists: !!row, data: function(){ return row ? row.data : undefined; } }); }
    });
  }
  function listen(c, id, fn, err){
    (listeners[c] = listeners[c] || []).push({ id: id, fn: fn, err: err });
    notify(c);
    return function(){ listeners[c] = (listeners[c] || []).filter(function(l){ return l.fn !== fn; }); };
  }
  function split(p){ var i = p.lastIndexOf("/"); return [p.slice(0, i), p.slice(i + 1)]; }
  function docRef(c, id){
    return {
      id: id,
      set: async function(data){ var r = await sb.from("docs").upsert({ collection: c, id: id, data: data, updated_at: new Date().toISOString() }); if (r.error) throw r.error; notify(c); },
      update: async function(data){ var cur = await sb.from("docs").select("data").eq("collection", c).eq("id", id).maybeSingle(); var r = await sb.from("docs").upsert({ collection: c, id: id, data: Object.assign({}, cur.data && cur.data.data, data) }); if (r.error) throw r.error; notify(c); },
      delete: async function(){ var r = await sb.from("docs").delete().eq("collection", c).eq("id", id); if (r.error) throw r.error; notify(c); },
      onSnapshot: function(fn, err){ return listen(c, id, fn, err); }
    };
  }
  function colRef(c){
    return {
      path: c,
      doc: function(id){ return docRef(c, id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2))); },
      add: async function(data){ var d = this.doc(); await d.set(data); return d; },
      onSnapshot: function(fn, err){ return listen(c, null, fn, err); }
    };
  }
  var db = sb && {
    doc: function(p){ var s = split(p); return docRef(s[0], s[1]); },
    collection: function(p){ return colRef(p); }
  };

  async function isAdmin(){
    if (!uid) return false;
    if (!adminP) adminP = sb.rpc("is_admin").then(function(r){ return r.data === true; }, function(){ return false; });
    return adminP;
  }
  var user = sb && {
    id: async function(){ return uid; },
    isOwner: isAdmin,
    canEdit: isAdmin,
    me: async function(){ return { id: uid, email: session && session.user && session.user.email, name: "" }; },
    profiles: async function(ids){
      var out = {}; if (!ids || !ids.length) return out;
      var r = await sb.from("docs").select("id,data").eq("collection", "points").in("id", ids);
      (r.data || []).forEach(function(x){ out[x.id] = { id: x.id, name: (x.data && x.data.name) || "" }; });
      return out;
    }
  };
  var downloads = {
    save: async function(req){
      var blob = req.data instanceof Blob ? req.data : new Blob([req.data]);
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = req.filename || "file";
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return { status: "saved" };
    }
  };

  var ready = (async function(){
    if (!sb) return;
    var s = await sb.auth.getSession(); session = s.data.session; uid = session ? session.user.id : null;
    sb.auth.onAuthStateChange(function(ev, sess){
      var nid = sess ? sess.user.id : null;
      if (nid !== uid) location.reload();
    });
    try {
      sb.channel("docs-changes").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, function(p){
        var c = (p.new && p.new.collection) || (p.old && p.old.collection); if (c) notify(c);
      }).subscribe();
    } catch(e) {}
    setInterval(function(){ Object.keys(listeners).forEach(notify); }, 60000);
  })();

  window.claude = {
    use: async function(name){
      await ready;
      if (name === "db") return db || null;
      if (name === "user") return user || null;
      if (name === "downloads") return downloads;
      return null; // sample (AI advisor) is not available outside Claude
    }
  };

  /* ---- sign in / sign out ---- */
  var TX = {
    ar: { t: "تسجيل الدخول", p: "أدخل بريدك الإلكتروني ليصلك رابط الدخول.", e: "البريد الإلكتروني", b: "أرسل رابط الدخول", ok: "أرسلنا رابط الدخول إلى بريدك.", err: "تعذّر الإرسال، حاول بعد قليل.", out: "تسجيل الخروج", off: "تسجيل الدخول غير مفعّل بعد." },
    en: { t: "Sign in", p: "Enter your email to receive a sign-in link.", e: "Email", b: "Send sign-in link", ok: "We sent a sign-in link to your email.", err: "Couldn't send, please try again shortly.", out: "Sign out", off: "Sign-in isn't enabled yet." }
  };
  window.BOSLA_AUTH = {
    form: function(lang){
      var x = TX[lang] || TX.ar;
      if (!sb) return '<p class="note">' + x.off + "</p>";
      return '<div class="panel" style="max-width:460px"><h3>' + x.t + '</h3><p class="note" style="margin-top:4px">' + x.p + '</p><form class="form" id="loginForm" style="margin-top:10px"><label>' + x.e + '<input id="loginEmail" type="email" required dir="ltr" autocomplete="email"></label><div><button class="btn" type="submit">' + x.b + '</button></div></form></div>';
    },
    logout: function(lang){ var x = TX[lang] || TX.ar; return sb && uid ? '<button class="btn line" type="button" id="logoutBtn" style="font-size:13px;padding:5px 12px">' + x.out + "</button>" : ""; }
  };
  document.addEventListener("submit", async function(e){
    if (e.target.id !== "loginForm") return; e.preventDefault();
    var lang = document.documentElement.lang === "en" ? "en" : "ar", x = TX[lang];
    var email = document.getElementById("loginEmail").value.trim(); if (!email) return;
    var r = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin + location.pathname } });
    var tEl = document.getElementById("toast"); if (tEl) { tEl.textContent = r.error ? x.err : x.ok; tEl.classList.add("on"); setTimeout(function(){ tEl.classList.remove("on"); }, 3500); }
  });
  document.addEventListener("click", async function(e){
    if (e.target.closest && e.target.closest("#logoutBtn")) { await sb.auth.signOut(); location.reload(); }
  });
})();

</script>
</head><body>
<title>بوصلة القطاع غير الربحي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Layout: light sticky header with section tabs; hero carries a ripple motif: concentric rings spreading from a seed point. Single light look by design. Palette: cream / navy / copper / sage */
:root{
  color-scheme:light;
  --bg:#FAF8F2; --surface:#FFFFFF; --fg:#2A2F3A; --muted:#676B74; --line:#EAE4D6;
  --navy:#0F3557; --copper:#BA6740; --copper-soft:#F6E9DF; --navy-soft:#E8EEF4;
  --sage:#5E8B6E; --sage-soft:#E6F0E8; --sand:#F1E7D6;
  --ok:#2F7D55; --ok-soft:#E1F0E7; --warn:#A86A12; --warn-soft:#F8EDD8;
  --head:#FFFFFF; --head-fg:#0F3557; --head-muted:#7A7F88;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --latin:"Montserrat","IBM Plex Sans Arabic",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.65;margin:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(186,103,64,.10) 1px,transparent 0);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
[lang="en"] body,[dir="ltr"]{font-family:var(--latin)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);color:var(--head-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand b{font-size:22px;font-weight:700;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--head-muted);font-weight:400}
.lang{font:inherit;font-size:13px;font-weight:600;background:transparent;color:var(--head-fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.lang:hover{border-color:var(--copper);color:var(--copper)}
.lang:focus-visible,nav button:focus-visible{outline:2px solid #BA6740;outline-offset:2px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:14px;background:none;border:0;color:var(--head-fg);opacity:.7;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button:hover{opacity:1}
nav button[aria-selected="true"]{opacity:1;border-bottom-color:#BA6740;font-weight:600}
main{padding-block:26px 120px}
h1{font-size:28px;line-height:1.3;margin:0 0 10px;text-wrap:balance}
h2{font-size:20px;margin:0 0 6px;color:var(--navy);text-wrap:balance;display:flex;align-items:center;gap:10px}
h2::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,var(--copper) 0 3px,transparent 3.5px),radial-gradient(circle,transparent 5px,rgba(186,103,64,.45) 5.5px 6.5px,transparent 7px),radial-gradient(circle,transparent 8px,rgba(94,139,110,.4) 8.5px 9px,transparent 9.5px)}
h3{font-size:16px;margin:0;text-wrap:balance}
.lead{color:var(--muted);max-width:65ch;margin:0 0 18px}
.section{margin-bottom:34px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#FFFFFF 0%,var(--sand) 55%,var(--copper-soft) 100%);color:var(--navy);border:1px solid var(--line);border-radius:20px;padding:34px 28px;display:grid;gap:16px;margin-bottom:34px}
.hero>*{position:relative;z-index:1;max-width:560px}
.hero .eyebrow{font-size:13px;font-weight:600;color:var(--sage);letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px}
.hero .eyebrow::before{content:"";width:22px;height:2px;background:var(--sage);border-radius:2px}
.hero h1{font-size:32px}
.hero h1 em{font-style:normal;color:var(--copper)}
.hero p{color:var(--muted);margin:0;max-width:56ch}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.ripple{position:absolute;z-index:0;inset-block:-40px;inset-inline-end:-80px;width:440px;max-width:none;pointer-events:none;opacity:.9}
.ripple circle.r{fill:none;stroke-width:1.5;transform-origin:220px 220px;animation:pulse 6s ease-out infinite}
.ripple circle.r:nth-child(2){animation-delay:1.5s}.ripple circle.r:nth-child(3){animation-delay:3s}.ripple circle.r:nth-child(4){animation-delay:4.5s}
@keyframes pulse{0%{transform:scale(.25);opacity:.9}100%{transform:scale(1);opacity:0}}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:4px}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:24px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:12px;color:var(--muted)}
@media (max-width:600px){.ripple{width:300px;inset-inline-end:-120px;opacity:.45}.hero h1{font-size:24px}.hero{padding:26px 20px}}
.btn{font:inherit;font-size:14px;font-weight:600;background:var(--copper);color:#fff;border:0;border-radius:8px;padding:8px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.line{background:transparent;color:inherit;border:1px solid currentColor}
.btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,53,87,.08);border-color:rgba(186,103,64,.45)}
.card.soon{background:linear-gradient(160deg,var(--surface),var(--sage-soft))}
.card p{margin:0;color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-weight:600;white-space:nowrap}
.tag.cu{background:var(--copper-soft);color:var(--copper)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meta div{background:var(--bg);border-radius:8px;padding:6px 8px;font-size:12px;text-align:center}
.meta span{display:block;color:var(--muted);font-size:11px}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.link{color:var(--copper);font-weight:600;text-decoration:none;font-size:14px}
.link:hover{text-decoration:underline}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--copper);width:16px;height:16px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font:inherit;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--fg);padding:4px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.chip:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;counter-increment:s}
.step::before{content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--copper-soft);color:var(--copper);font-weight:700;font-size:13px;margin-bottom:6px;box-shadow:0 0 0 4px var(--surface),0 0 0 5px rgba(186,103,64,.3)}
.step:nth-child(even)::before{background:var(--sage-soft);color:var(--sage);box-shadow:0 0 0 4px var(--surface),0 0 0 5px rgba(94,139,110,.35)}
.step p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.soon{border-style:dashed}
.tray{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tray .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;flex-wrap:wrap}
.cmp{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:24px}
.cmp table{width:100%;border-collapse:collapse;min-width:560px}
.cmp th,.cmp td{padding:10px 12px;border-top:1px solid var(--line);text-align:start;vertical-align:top;font-size:14px}
.cmp tr:first-child th,.cmp tr:first-child td{border-top:0}
.cmp th{color:var(--muted);font-weight:600;width:130px;background:var(--bg)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
details+details{margin-top:10px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--copper);font-weight:700}
details[open] summary::after{content:"−"}
details p,details li{color:var(--muted);font-size:14px}
pre.tpl{white-space:pre-wrap;direction:ltr;text-align:left;font-family:var(--latin);font-size:13px;background:var(--bg);border-radius:8px;padding:14px;margin:12px 0 8px;line-height:1.7;overflow-x:auto}
.search{font:inherit;width:100%;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);margin-bottom:14px}
.search:focus{outline:2px solid var(--copper);outline-offset:1px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.term b{display:block}
.term .en{font-family:var(--latin);color:var(--copper);font-weight:600;direction:ltr;text-align:start;display:block}
.term p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.q+.q{margin-top:8px}
.q span{flex:1;min-width:200px}
.yn{display:flex;gap:6px}
.result{background:linear-gradient(135deg,var(--sage-soft),var(--surface));border:1px solid var(--line);color:var(--navy);border-radius:16px;padding:22px;margin-top:18px}
.result .score{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--sage)}
.result ul{margin:10px 0 0;padding-inline-start:20px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){.ripple circle.r{animation:none;transform:scale(.6);opacity:.5}.card:hover{transform:none}}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.voices{background:linear-gradient(160deg,var(--surface),var(--sand));border:1px solid var(--line);border-radius:20px;padding:24px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.avg{display:flex;align-items:center;gap:10px}
.avg b{font-size:34px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.avg small{color:var(--muted);font-size:13px;display:block}
.stars{color:#D9A441;letter-spacing:2px;font-size:16px;white-space:nowrap}
.stars .off{color:#E2DCCB}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.review{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.review::before{content:"”";position:absolute;inset-inline-end:14px;top:2px;font-size:54px;line-height:1;color:var(--copper-soft);font-family:Georgia,serif}
.review p{margin:0;color:var(--fg);font-size:14px;position:relative}
.who{display:flex;align-items:center;gap:10px;margin-top:auto}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sage-soft);color:var(--sage);flex:none}
.review:nth-child(even) .av{background:var(--copper-soft);color:var(--copper)}
.who b{display:block;font-size:14px}
.who small{color:var(--muted);font-size:12px}
.mine{font-size:11px;color:var(--sage);font-weight:600}
.rform{margin-top:18px;background:var(--surface);border:1px dashed rgba(186,103,64,.5);border-radius:14px;padding:16px;display:grid;gap:10px}
.rform .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rform input,.rform textarea{font:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.rform textarea{min-height:80px;resize:vertical}
.rform input:focus,.rform textarea:focus{outline:2px solid var(--copper);outline-offset:1px}
.rate{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.rate button{font-size:26px;line-height:1;background:none;border:0;cursor:pointer;color:#E2DCCB;padding:2px}
.rate button.on{color:#D9A441}

/* ratings of programs */
function ratingOf(pid){const xs=R.ratings.map(r=>Number((r.r||{})[pid])||0).filter(Boolean);return{n:xs.length,avg:xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0}}
const myRating=pid=>Number(((R.ratings.find(r=>r.id===R.uid)||{}).r||{})[pid])||0;
async function rateProgram(pid,n){
 if(!R.db||!R.uid){toast(t("login"));return}
 const cur=(R.ratings.find(r=>r.id===R.uid)||{}).r||{};
 try{await R.db.doc("ratings/"+R.uid).set({r:{...cur,[pid]:n}});award("rate_"+pid,POINTS.rate)}catch(_){toast(t("vErr"))}
}
const starStr=n=>`<span class="stars" aria-label="${n}/5">${"★".repeat(n)}<span class="off">${"★".repeat(5-n)}</span></span>`;

/* ---------- program card ---------- */
function programCard(p){
 const on=S.cmp.includes(p.id);
 const mode=p.mode==="online"?t("online"):t("checkSite");
 const cost=p.cost==="free"?t("free"):p.cost==="paid"?t("paid"):t("checkSite");
 const rt=ratingOf(p.id),mine=myRating(p.id);
 const canApply=p.type!=="directory";
 return `<article class="card">
  <div class="tags"><span class="tag">${t(p.type)}</span><span class="tag ${p.region==="local"?"cu":""}">${t(p.region)}</span>${p.status!=="existing"?`<span class="tag soonT">${t("st_"+p.status)}</span>`:""}${p.cost==="free"?`<span class="tag ok">${t("free")}</span>`:""}${p.fields.slice(0,2).map(f=>`<span class="tag" style="background:var(--sage-soft);color:var(--sage)">${t(f)}</span>`).join("")}</div>
  <h3>${esc(L(p.name))}</h3>
  <p>${esc(L(p.provider))}${L(p.country)?" · "+esc(L(p.country)):""}</p>
  <p>${esc(L(p.focus))}</p>
  <div class="meta"><div><span>${t("lang")}</span>${t(p.lng)}</div><div><span>${t("mode")}</span>${mode}</div><div><span>${t("cost")}</span>${cost}</div></div>
  ${canApply?`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="rsum">${rt.n?`${starStr(Math.round(rt.avg))} ${rt.avg.toFixed(1)} · ${rt.n} ${t("ratings")}`:t("noRatings")}</span>
   <span class="myrate" role="group" aria-label="${t("rateIt")}">${[1,2,3,4,5].map(n=>`<button type="button" data-rate="${p.id}" data-n="${n}" class="${n<=mine?"on":""}" aria-label="${n}">★</button>`).join("")}</span></div>`:""}
  <div class="cardfoot">${canApply?`<a class="btn apply" href="${esc(p.url)}" target="_blank" rel="noopener">${t("apply")} ${arrow()}</a>`:`<a class="link" href="${esc(p.url)}" target="_blank" rel="noopener">${t("visit")} ${arrow()}</a>`}
   <div style="display:flex;gap:10px;align-items:center">${canApply?followBtn(p.id):""}${canApply?`<label class="chk"><input type="checkbox" id="c-${p.id}" data-cmp="${p.id}" ${on?"checked":""}> ${t("compareAdd")}</label>`:""}</div></div>
 </article>`;
}
function comparison(){
 const ps=programs().filter(p=>S.cmp.includes(p.id));
 if(ps.length<2)return "";
 const row=(k,f)=>`<tr><th>${t(k)}</th>${ps.map(p=>`<td>${f(p)}</td>`).join("")}</tr>`;
 return `<div id="cmpBox"><h2>${t("cmpT")}</h2><div class="cmp"><table>
  <tr><th></th>${ps.map(p=>`<td><b>${esc(L(p.name))}</b></td>`).join("")}</tr>
  ${row("provider",p=>esc(L(p.provider)))}${row("type",p=>t(p.type))}${row("status",p=>t("st_"+p.status))}${row("region",p=>t(p.region))}
  ${row("mode",p=>p.mode==="online"?t("online"):t("checkSite"))}${row("cost",p=>p.cost==="free"?t("free"):p.cost==="paid"?t("paid"):t("checkSite"))}
  ${row("lang",p=>t(p.lng))}${row("ratings",p=>{const r=ratingOf(p.id);return r.n?r.avg.toFixed(1)+" / 5":"—"})}${row("focus",p=>esc(L(p.focus)))}
 </table></div></div>`;
}

   js[jid]={done:has?cur.done.filter(x=>x!==ref):[...cur.done,ref]};if(await savePrefs({journeys:js})){if(!has)award("step_"+ref,POINTS.step);rerender()}}
  else if(d.joinc){const cs=Array.isArray(R.prefs.communities)?R.prefs.communities:[];const on=cs.includes(d.joinc);const next=on?cs.filter(x=>x!==d.joinc):[...cs,d.joinc];
   if(await savePrefs({communities:next})){try{await R.db.doc("members/"+R.uid).set({c:next})}catch(_){}rerender()}}
  else if(d.level){if(await savePrefs({profile:{...(R.prefs.profile||{}),level:d.level}}))rerender()}
  else if(d.ans){S.answers[d.ans]=d.v==="1";rerender();if(Object.keys(S.answers).length===QUESTIONS.ar.length)award("ready",POINTS.ready)}
  else if(d.sg){reviewSuggestion(d.sg,d.act)}

 }

 const html=`<html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${esc(p.name||"CV")}</title><style>body{font-family:Arial,sans-serif;color:#2A2F3A;line-height:1.6}h1{color:#0F3557;margin:0}h2{color:#BA6740;border-bottom:1px solid #EAE4D6;padding-bottom:4px}</style></head><body>

 ${p.bio?`<h2>نبذة</h2><p>${esc(p.bio)}</p>`:""}<h2>المرحلة المهنية</h2><p>${esc(T.ar[p.level||"lv_beg"])}</p>
 ${js.length?`<h2>الرحلات التعليمية</h2><ul>${js.map(j=>`<li>${esc(j.name.ar)} (${jPct(j)}%)</li>`).join("")}</ul>`:""}
 <h2>البرامج المنجزة</h2>${done.length?`<ul>${done.map(d=>`<li>${esc(d.name.ar)} – ${esc(d.sub.ar)}</li>`).join("")}</ul>`:"<p>—</p>"}

 try{await R.downloads.save({filename:`${(p.name||"cv").replace(/[\\/:*?"<>|]/g,"")}-bosla.doc`,data:new Blob([html],{type:"application/msword"})})}catch(err){if(err?.code!=="declined")toast(t("cvFail"))}

/* ---------- boot ---------- */
try{const l=localStorage.getItem("bosla-lang");if(l==="en"||l==="ar")S.lang=l}catch(e){}
const h=(location.hash||"").slice(1);if(TABS.includes(h))S.tab=h;
render();
(async()=>{
 const use=n=>window.claude?.use?.(n);
 const db=await use("db");
 if(!db){R.list=[];R.board=[];refreshVoices();refreshBoard();return}
 R.db=db;
 try{R.user=await use("user");R.uid=R.user?await R.user.id():null;R.owner=R.user?await R.user.isOwner():false}catch(_){R.uid=null}
 use("sample").then(s=>{R.sample=s||null;if(S.tab==="account")rerender()});
 use("downloads").then(s=>{R.downloads=s||null;if(S.tab==="account")rerender()});
 const keep=fn=>(snap)=>{fn(snap.docs.map(d=>({id:d.id,...d.data()})))};
 db.collection("reviews").onSnapshot(keep(x=>{R.list=x.sort((a,b)=>(b.at||0)-(a.at||0));refreshVoices()}),()=>{R.list=R.list||[];refreshVoices()});
 db.collection("points").onSnapshot(keep(x=>{R.board=x;refreshBoard();resolveNames()}),()=>{R.board=R.board||[];refreshBoard()});
 const soft=()=>{if(["programs","communities","funders","account"].includes(S.tab)&&!document.activeElement?.closest?.("form"))rerender()};
 db.collection("ratings").onSnapshot(keep(x=>{R.ratings=x;soft()}));
 db.collection("members").onSnapshot(keep(x=>{R.members=x;soft()}));
 db.collection("needs").onSnapshot(keep(x=>{R.needs=x.sort((a,b)=>(b.at||0)-(a.at||0));soft()}));
 if(R.owner){let SG=[],DONE={};const upd=()=>{R.suggest=SG.filter(y=>y&&y.id&&y.name&&y.url&&!DONE[y.id]).sort((a,b)=>(b.at||0)-(a.at||0));soft()};fetch("suggestions.json",{cache:"no-store"}).then(r=>r.ok?r.json():[]).then(x=>{SG=Array.isArray(x)?x:[];upd()}).catch(()=>{});db.collection("suggest").onSnapshot(keep(x=>{DONE={};x.forEach(d=>{DONE[d.id]=1});upd()}))}
 db.collection("catalog").onSnapshot(keep(x=>{R.extra=x.filter(y=>y.name&&y.url);soft()}));
 if(R.uid){
  R.prefsRef=db.collection("data/users/"+R.uid).doc("prefs");
  R.prefsRef.onSnapshot(s=>{R.prefs=s.data()||{};updateBell();if(!document.activeElement?.closest?.("form"))rerender()});
 }
 rerender();
})();
</script>

</body></html>
