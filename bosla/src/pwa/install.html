<style>
.inst{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#0F3557;color:#F7F5ED;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.2);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:14px;max-width:560px;margin:0 auto}
.inst img{width:40px;height:40px;border-radius:10px;flex:none}
.inst p{margin:0;flex:1;line-height:1.5}
.inst button{font:inherit;font-size:13px;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
.inst .go{background:#BA6740;color:#fff;font-weight:600}
.inst .x{background:transparent;color:#C9D3DE}
</style>
<div class="inst" id="instBar" hidden><img src="/icon-192.png" alt=""><p id="instTxt"></p><button class="go" id="instGo" type="button" hidden></button><button class="x" id="instX" type="button" aria-label="إغلاق">✕</button></div>
<script>
(function(){
  if ("serviceWorker" in navigator) addEventListener("load", function(){ navigator.serviceWorker.register("/sw.js").catch(function(){}); });
  var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  var seen = false; try { seen = localStorage.getItem("bosla-inst") === "1"; } catch(e) {}
  if (standalone || seen) return;
  var bar = document.getElementById("instBar"), txt = document.getElementById("instTxt"), go = document.getElementById("instGo");
  var ar = (document.documentElement.lang || "ar") !== "en";
  function close(){ bar.hidden = true; try { localStorage.setItem("bosla-inst", "1"); } catch(e) {} }
  document.getElementById("instX").onclick = close;
  var deferred = null;
  addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred = e;
    txt.textContent = ar ? "ثبّت بوصلة على جوالك لتفتحها مثل التطبيق." : "Install Bosla on your phone to open it like an app.";
    go.textContent = ar ? "تثبيت" : "Install"; go.hidden = false; bar.hidden = false;
  });
  go.onclick = function(){ if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(close); };
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (ios) setTimeout(function(){
    txt.textContent = ar ? "لتثبيت بوصلة: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»." : "To install Bosla: tap Share, then \"Add to Home Screen\".";
    bar.hidden = false;
  }, 2500);
})();
</script>
