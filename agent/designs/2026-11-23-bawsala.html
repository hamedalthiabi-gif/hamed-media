<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
:root{--n:#002544;--n2:#0b3a63;--c:#BB6841;--c2:#d0835d;--ink:#1c2a38;--mut:#5d6b78;--bg:#f6f3ef}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Ar,La;background:var(--bg);position:relative;color:var(--ink)}
.b1{position:absolute;width:820px;height:820px;left:-380px;top:-380px;border-radius:50%;background:radial-gradient(circle,#BB684120,#BB684100 70%)}
.top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot i{position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--c)}
.logo{position:absolute;top:56px;right:80px;width:210px}
.tag{position:absolute;top:64px;left:80px;font-size:24px;font-weight:600;color:var(--c);border:2px solid var(--c);border-radius:999px;padding:7px 24px}
.title{position:absolute;top:180px;right:80px;left:80px;font-weight:600;font-size:62px;color:var(--n);line-height:1.25}
.title em{font-style:normal;color:var(--c)}
.wrap{position:absolute;top:400px;left:0;right:0;height:720px}
.ring{position:absolute;left:340px;top:160px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,#fff 0 58%,#f0e9e2 59% 100%);border:2px solid #0025441f;box-shadow:0 30px 60px -36px #002544aa}
.ring:before{content:"";position:absolute;inset:26px;border-radius:50%;border:2px dashed #BB684166}
.needle{position:absolute;left:340px;top:160px;width:400px;height:400px}
.q{position:absolute;width:300px;background:#fff;border-radius:26px;border:1.5px solid #0025441a;box-shadow:0 20px 40px -30px #002544aa;padding:22px 24px;text-align:center}
.q b{display:block;font-size:31px;color:var(--n);font-weight:600}
.q p{font-size:23px;color:var(--mut);margin-top:6px;line-height:1.4}
.q i{display:block;width:40px;height:5px;border-radius:4px;background:var(--c);margin:0 auto 12px}
.n{left:390px;top:0}.s{left:390px;top:590px}.e{right:40px;top:290px}.w{left:40px;top:290px}
.slog{position:absolute;top:1182px;width:100%;text-align:center;font-size:29px;font-weight:600;color:var(--c)}
.url{position:absolute;bottom:62px;width:100%;text-align:center;font-family:La,Ar;font-size:27px;color:var(--n);direction:ltr}
</style></head><body>
<div class="b1"></div><div class="top"></div>
<img class="logo" src="../../hamed-site/logo_navy.png">
<div class="tag">للمنضمين حديثًا</div>
<div class="title">بدأت العمل في<br><em>القطاع غير الربحي</em>؟</div>
<div class="wrap">
 <div class="ring"></div>
 <svg class="needle" viewBox="0 0 400 400"><polygon points="200,70 222,200 178,200" fill="#BB6841"/><polygon points="200,330 222,200 178,200" fill="#002544"/><circle cx="200" cy="200" r="16" fill="#fff" stroke="#002544" stroke-width="5"/></svg>
 <div class="q n"><i></i><b>رحلة حول القطاع</b><p>مقدمات ولمحة عنه في المملكة</p></div>
 <div class="q e"><i></i><b>التعلم</b><p>برامج وجهات تدريبية</p></div>
 <div class="q w"><i></i><b>أبرز التقارير</b><p>تقارير القطاع السنوية</p></div>
 <div class="q s"><i></i><b>مصادر أخرى</b><p>منصات ومجتمعات مهنية</p></div>
</div>
<div class="slog">استدامة العطاء وأثرٌ يمتد</div>
<div class="url">hamedalthiabi.com</div>
<div class="bot"><i></i></div>
</body></html>
