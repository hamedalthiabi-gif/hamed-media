<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
:root{--n:#002544;--n2:#0b3a63;--c:#BB6841;--c2:#d0835d;--ink:#1c2a38;--mut:#5d6b78;--bg:#f6f3ef}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Ar,La;background:var(--bg);position:relative;color:var(--ink)}
.b1{position:absolute;width:760px;height:760px;left:-300px;top:-320px;border-radius:50%;background:radial-gradient(circle,#BB68412e,#BB684100 70%)}
.b2{position:absolute;width:820px;height:820px;right:-380px;bottom:-360px;border-radius:50%;background:radial-gradient(circle,#0025441f,#00254400 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#00254412 1.6px,transparent 1.6px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000 0,#0000 30%,#0000 75%,#000)}
.top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot i{position:absolute;right:0;top:0;bottom:0;width:30%;background:var(--c)}
.logo{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:220px}
.t1,.t2{position:absolute;width:100%;text-align:center;font-weight:600;font-size:62px;line-height:1.2}
.t1{top:178px;color:var(--n)}
.t2{top:262px;color:var(--c)}
svg.road{position:absolute;left:0;top:360px;width:1080px;height:820px}
.goal{position:absolute;top:372px;left:118px;width:250px;text-align:center}
.goal .ic{width:150px;height:150px;margin:0 auto;border-radius:50%;background:linear-gradient(150deg,#d0835d,#BB6841 55%,#9c522f);display:flex;align-items:center;justify-content:center;box-shadow:0 22px 44px -20px #BB6841,0 0 0 14px #BB68411f}
.goal .ic svg{width:72px;height:72px}
.goal h3{margin-top:22px;font-size:40px;font-weight:600;color:var(--c)}
.start{position:absolute;top:952px;right:96px;width:270px;text-align:center}
.start .ic{width:104px;height:104px;margin:0 auto;border-radius:50%;background:#fff;border:2px dashed #5d6b7866;display:flex;align-items:center;justify-content:center}
.start .ic svg{width:52px;height:52px}
.start h3{margin-top:14px;font-size:32px;font-weight:600;color:var(--mut)}
.ms{position:absolute;display:flex;align-items:center;gap:20px;background:#fff;border-radius:26px;padding:20px 28px 20px 24px;box-shadow:0 18px 40px -24px #002544aa;border:1.5px solid #0025441a;white-space:nowrap}
.ms .ic{width:66px;height:66px;border-radius:20px;background:var(--n);display:flex;align-items:center;justify-content:center;flex:none}
.ms .ic svg{width:36px;height:36px}
.ms b{font-size:31px;font-weight:600;color:var(--n)}
.m1{top:842px;left:120px}
.m2{top:712px;right:108px}
.m3{top:566px;left:400px}
.tag{position:absolute;top:1104px;left:96px;font-size:27px;font-weight:600;color:var(--n);opacity:.75;display:flex;align-items:center;gap:12px}
.tag:before{content:"";width:42px;height:4px;border-radius:4px;background:var(--c)}
.slog{position:absolute;top:1168px;width:100%;text-align:center;font-size:30px;font-weight:600;color:var(--n)}
.pill{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#fff;border-radius:999px;padding:10px 32px 10px 12px;box-shadow:0 14px 30px -18px #00254477;border:1.5px solid #0025441c;white-space:nowrap}
.pill .dot{width:46px;height:46px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center}
.pill .dot svg{width:26px;height:26px}
.pill span{font-family:La,Ar;font-size:28px;color:var(--n);direction:ltr}
</style></head><body>
<div class="b1"></div><div class="b2"></div><div class="dots"></div><div class="top"></div>
<img class="logo" src="../../hamed-site/logo_navy.png">
<div class="t1">الاستدامة المالية هي الطريق</div>
<div class="t2">والحرية المالية هي الغاية</div>

<svg class="road" viewBox="0 0 1080 820" fill="none">
 <defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5d6b78" stop-opacity=".35"/><stop offset=".45" stop-color="#002544"/><stop offset="1" stop-color="#BB6841"/></linearGradient></defs>
 <path d="M850 640 C 850 540, 260 600, 260 470 S 820 380, 820 260 S 380 160, 250 90" stroke="url(#g)" stroke-width="58" stroke-linecap="round" opacity=".14"/>
 <path d="M850 640 C 850 540, 260 600, 260 470 S 820 380, 820 260 S 380 160, 250 90" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>
 <path d="M850 640 C 850 540, 260 600, 260 470 S 820 380, 820 260 S 380 160, 250 90" stroke="#fff" stroke-width="3" stroke-dasharray="14 16" stroke-linecap="round"/>
</svg>

<div class="goal">
 <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-2.5 4L16 12H5"/></svg></div>
 <h3>الحرية المالية</h3>
</div>

<div class="ms m3"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg></div><b>تخدم قضيتها بثقة</b></div>
<div class="ms m2"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3"/><circle cx="5" cy="17" r="2.5"/><circle cx="19" cy="17" r="2.5"/><path d="M12 10v3M12 13l-5 2M12 13l5 2"/></svg></div><b>قرار يبدأ من مجلس الإدارة</b></div>
<div class="ms m1"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/></svg></div><b>مصادر دخل تناسب طبيعتها</b></div>

<div class="start">
 <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#5d6b78" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.3v.2"/></svg></div>
 <h3>الطوارئ المالية</h3>
</div>

<div class="slog">استدامة العطاء وأثرٌ يمتد</div>
<div class="pill"><div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></div><span>hamedalthiabi.com</span></div>
<div class="bot"><i></i></div>
</body></html>
