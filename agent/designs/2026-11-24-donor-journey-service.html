<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
:root{--n:#002544;--n2:#0b3a63;--c:#BB6841;--c2:#d0835d;--ink:#1c2a38;--mut:#5d6b78;--bg:#f6f3ef}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Ar,La;background:var(--bg);position:relative;color:var(--ink)}
.b1{position:absolute;width:900px;height:900px;right:-420px;top:-420px;border-radius:50%;background:radial-gradient(circle,#BB684122,#BB684100 70%)}
.b2{position:absolute;width:800px;height:800px;left:-360px;bottom:-320px;border-radius:50%;background:radial-gradient(circle,#0025441c,#00254400 70%)}
.top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot i{position:absolute;right:0;top:0;bottom:0;width:30%;background:var(--c)}
.logo{position:absolute;top:56px;right:80px;width:210px}
.tag{position:absolute;top:64px;left:80px;font-size:24px;font-weight:600;color:var(--c);border:2px solid var(--c);border-radius:999px;padding:7px 24px}
.title{position:absolute;top:180px;right:80px;left:80px;font-weight:600;font-size:64px;color:var(--n);line-height:1.25}
.title em{font-style:normal;color:var(--c)}
.sub{position:absolute;top:350px;right:82px;left:80px;font-size:29px;color:var(--mut);line-height:1.5}
svg.road{position:absolute;left:0;top:430px}
.st{position:absolute;width:190px;text-align:center}
.st .dot{width:92px;height:92px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid var(--n);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 30px -18px #002544cc;position:relative}
.st .dot svg{width:42px;height:42px}
.st .dot span{position:absolute;top:-10px;right:-8px;width:36px;height:36px;border-radius:50%;background:var(--n);color:#fff;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center}
.st b{display:block;margin-top:12px;font-size:31px;font-weight:600;color:var(--n)}
.st.after .dot{background:var(--n);border-color:var(--n)}
.st.after .dot span{background:var(--c)}
.st.goal .dot{background:var(--c);border-color:var(--c);width:110px;height:110px}
.st.goal b{color:var(--c);position:absolute;top:30px;right:200px;margin:0;font-size:40px;white-space:nowrap}
.split{position:absolute;top:1110px;right:80px;left:80px;display:flex;gap:22px}
.split div{flex:1;border-radius:24px;padding:20px 26px;font-size:27px;font-weight:600;line-height:1.4;display:flex;align-items:center;gap:16px}
.split .a{background:#fff;border:1.5px solid #0025441f;color:var(--n)}
.split .b{background:var(--n);color:#fff}
.split i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--c)}
.slog{position:absolute;top:1228px;width:100%;text-align:center;font-size:28px;font-weight:600;color:var(--c)}
.url{position:absolute;bottom:52px;width:100%;text-align:center;font-family:La,Ar;font-size:25px;color:var(--n);direction:ltr}
</style></head><body>
<div class="b1"></div><div class="b2"></div><div class="top"></div>
<img class="logo" src="../../hamed-site/logo_navy.png">
<div class="tag">رحلة المتبرع</div>
<div class="title">من أول تعرّف<br>إلى <em>داعم دائم</em></div>
<div class="sub">سبع مراحل يقطعها المتبرع مع جهتك</div>

<svg class="road" width="1080" height="640" viewBox="0 0 1080 640" fill="none">
 <path d="M930 90 H190 C110 90 110 330 190 330 H890 C970 330 970 560 890 560 H490" stroke="#00254433" stroke-width="16" stroke-linecap="round"/>
 <path d="M930 90 H190 C110 90 110 330 190 330 H890 C970 330 970 560 890 560 H490" stroke="#BB6841" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 16"/>
</svg>

<!-- row 1 (right to left): 1,2,3 -->
<div class="st" style="top:474px;left:835px"><div class="dot"><span>١</span><svg viewBox="0 0 24 24" fill="none" stroke="#002544" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"/><path d="M7 13.5V18a1.5 1.5 0 0 0 3 0v-3.5"/><path d="M21 9.5v5"/></svg></div><b>الوعي</b></div>
<div class="st" style="top:474px;left:445px"><div class="dot"><span>٢</span><svg viewBox="0 0 24 24" fill="none" stroke="#002544" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></div><b>الاهتمام</b></div>
<div class="st" style="top:474px;left:95px"><div class="dot"><span>٣</span><svg viewBox="0 0 24 24" fill="none" stroke="#002544" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M9.5 12.5l2 2 3.5-4"/></svg></div><b>القرار</b></div>
<!-- row 2 (left to right): 4,5,6 -->
<div class="st after" style="top:714px;left:255px"><div class="dot"><span>٤</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></div><b>التقدير</b></div>
<div class="st after" style="top:714px;left:535px"><div class="dot"><span>٥</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8.5l1.5 1.5 3-3M8 15l1.5 1.5 3-3M15 9h2M15 15.5h2"/></svg></div><b>المتابعة</b></div>
<div class="st after" style="top:714px;left:800px"><div class="dot"><span>٦</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6.5 7-6.5 0 4-3 6.5-7 6.5zM12 15c0-3-2.4-5-5.5-5 0 3 2.4 5 5.5 5z"/><path d="M8 21h8"/></svg></div><b>الولاء</b></div>
<!-- 7: goal -->
<div class="st goal" style="top:932px;left:335px"><div class="dot"><span>٧</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg></div><b>الشراكة</b></div>

<div class="split">
 <div class="a"><i></i>قبل أول تبرع: ثلاث مراحل</div>
 <div class="b"><i></i>بعده تُبنى الاستدامة: أربع مراحل</div>
</div>
<div class="slog">استدامة العطاء وأثرٌ يمتد</div>
<div class="url">hamedalthiabi.com</div>
<div class="bot"><i></i></div>
</body></html>
