<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
:root{--t:#0F686F;--t2:#13858d;--ink:#243438;--mut:#5f7275;--bg:#f4f6f5;--g:#9aa8aa}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Ar,La;background:var(--bg);position:relative;color:var(--ink)}
.b1{position:absolute;width:640px;height:640px;right:-280px;top:-260px;border-radius:50%;background:radial-gradient(circle,#0F686F22,#0F686F00 70%)}
.b2{position:absolute;width:700px;height:700px;left:-300px;bottom:-300px;border-radius:50%;background:radial-gradient(circle,#0F686F1c,#0F686F00 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#0F686F18 1.6px,transparent 1.6px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000 0,#0000 30%,#0000 75%,#000)}
.top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,var(--t),var(--t2))}
.bot{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(90deg,var(--t),var(--t2))}
.logo{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:210px}
.title{position:absolute;top:205px;width:100%;text-align:center;font-weight:600;font-size:68px;color:var(--t);line-height:1.2}
.sub{position:absolute;top:298px;width:100%;text-align:center;font-size:30px;color:var(--mut)}
.cols{position:absolute;top:390px;left:56px;right:56px;display:flex;gap:28px}
.col{flex:1;border-radius:34px;padding:30px 30px 26px;position:relative}
.c1{background:#fff;border:1.5px solid #0F686F1a;box-shadow:0 18px 40px -26px #0F686F55}
.c2{background:linear-gradient(160deg,#16898f,#0F686F 55%,#0b5257);color:#fff;box-shadow:0 26px 50px -22px #0F686Fbb}
.hd{display:flex;align-items:center;gap:16px}
.ic{width:72px;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
.c1 .ic{background:#0F686F12}.c2 .ic{background:#ffffff22}
.ic svg{width:40px;height:40px}
.nm{font-size:44px;font-weight:600;line-height:1.1}
.c1 .nm{color:var(--ink)}
.chart{height:280px;margin:26px 0 14px;border-radius:22px;position:relative;overflow:hidden}
.c1 .chart{background:#0F686F08}.c2 .chart{background:#ffffff14}
.chart svg{position:absolute;inset:0;width:100%;height:100%}
.row{display:flex;align-items:flex-start;gap:14px;padding:22px 0;border-top:1.5px dashed}
.c1 .row{border-color:#0F686F22}.c2 .row{border-color:#ffffff38}
.k{font-size:22px;font-weight:600;min-width:92px;padding-top:4px}
.c1 .k{color:var(--g)}.c2 .k{color:#ffffffaa}
.v{font-size:29px;line-height:1.35;font-weight:600}
.c1 .v{color:var(--mut)}
.pill{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:#fff;border-radius:999px;padding:16px 36px 16px 18px;box-shadow:0 14px 30px -18px #0F686F66;border:1.5px solid #0F686F1a;white-space:nowrap}
.pill .dot{width:52px;height:52px;border-radius:50%;background:var(--t);display:flex;align-items:center;justify-content:center}
.pill .dot svg{width:28px;height:28px}
.pill span{font-size:31px;font-weight:600;color:var(--ink)}
.vs{position:absolute;top:640px;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:#fff;border:1.5px solid #0F686F22;box-shadow:0 10px 24px -12px #0F686F88;display:flex;align-items:center;justify-content:center;font-family:La;font-size:26px;color:var(--t);z-index:3}
</style></head><body>
<div class="b1"></div><div class="b2"></div><div class="dots"></div><div class="top"></div>
<img class="logo" src="../brand/old_logo.png">
<div class="title">الحملة أم البرنامج المستمر؟</div>
<div class="sub">الفرق يظهر في خط الدخل على مدار العام</div>
<div class="vs">VS</div>
<div class="cols">
 <div class="col c1">
  <div class="hd"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#0F686F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l15-6v14L3 13z"/><path d="M7 13.5V18a2 2 0 0 0 4 0v-3"/><path d="M21 9v6"/></svg></div><div class="nm">الحملة</div></div>
  <div class="chart"><svg viewBox="0 0 440 200" preserveAspectRatio="none">
   <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F686F" stop-opacity=".22"/><stop offset="1" stop-color="#0F686F" stop-opacity="0"/></linearGradient></defs>
   <path d="M0 178 L60 176 L110 172 L150 40 L190 150 L230 174 L300 177 L340 176 L370 70 L405 165 L440 176 L440 200 L0 200z" fill="url(#g1)"/>
   <path d="M0 178 L60 176 L110 172 L150 40 L190 150 L230 174 L300 177 L340 176 L370 70 L405 165 L440 176" fill="none" stroke="#0F686F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
   <line x1="0" y1="186" x2="440" y2="186" stroke="#0F686F" stroke-opacity=".15" stroke-width="2"/></svg></div>
  <div class="row"><div class="k">الدخل</div><div class="v">دفعة ثم هبوط</div></div>
  <div class="row"><div class="k">التخطيط</div><div class="v">من حملة إلى أخرى</div></div>
  <div class="row"><div class="k">المتبرع</div><div class="v">عطاء لمرة واحدة</div></div>
 </div>
 <div class="col c2">
  <div class="hd"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.5M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.6 4.5M20 20v-4h-4"/></svg></div><div class="nm">البرنامج المستمر</div></div>
  <div class="chart"><svg viewBox="0 0 440 200" preserveAspectRatio="none">
   <g fill="#ffffff" fill-opacity=".85">
   <rect x="22" y="138" width="22" height="48" rx="6"/><rect x="56" y="132" width="22" height="54" rx="6"/><rect x="90" y="126" width="22" height="60" rx="6"/><rect x="124" y="119" width="22" height="67" rx="6"/><rect x="158" y="112" width="22" height="74" rx="6"/><rect x="192" y="105" width="22" height="81" rx="6"/><rect x="226" y="98" width="22" height="88" rx="6"/><rect x="260" y="90" width="22" height="96" rx="6"/><rect x="294" y="82" width="22" height="104" rx="6"/><rect x="328" y="74" width="22" height="112" rx="6"/><rect x="362" y="66" width="22" height="120" rx="6"/><rect x="396" y="58" width="22" height="128" rx="6"/></g>
   <path d="M33 122 L407 42" stroke="#fff" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" opacity=".7"/></svg></div>
  <div class="row"><div class="k">الدخل</div><div class="v">يتكرر كل شهر</div></div>
  <div class="row"><div class="k">التخطيط</div><div class="v">أوضح واستجابة أسرع</div></div>
  <div class="row"><div class="k">المتبرع</div><div class="v">التزام طويل الأمد</div></div>
 </div>
</div>
<div class="pill"><div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></div><span>حوّل متبرع الحملة إلى داعم شهري</span></div>
<div class="bot"></div>
</body></html>
