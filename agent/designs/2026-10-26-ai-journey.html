<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
:root{--t:#0F686F;--t2:#13858d;--d:#0a4a4f;--ink:#243438;--mut:#5f7275}
*{margin:0;box-sizing:border-box}html{width:1080px;height:1350px;overflow:hidden}
body{width:1080px;height:1350px;overflow:clip;font-family:Ar,La;position:relative;color:#fff;
 background:radial-gradient(120% 80% at 85% 0%,#1a9099 0%,#0F686F 45%,#0a4a4f 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(circle at 50% 40%,#000 0,#0000 75%)}
.glow{position:absolute;width:700px;height:700px;border-radius:50%;left:-260px;bottom:-200px;background:radial-gradient(circle,#ffffff18,#fff0 65%)}
.logo{position:absolute;top:56px;right:64px;width:190px;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 12px 30px -14px #0008}
.tag{position:absolute;top:74px;left:64px;font-size:22px;font-weight:600;letter-spacing:.5px;border:1.5px solid #ffffff55;border-radius:999px;padding:8px 22px;color:#e6f4f4}
.title{position:absolute;top:210px;right:64px;left:64px;font-weight:600;font-size:76px;line-height:1.18}
.title em{font-style:normal;color:#9fe3e3}
.stat{position:absolute;top:440px;right:64px;display:flex;align-items:center;gap:26px}
.big{font-size:150px;font-weight:600;line-height:1;font-family:Ar,La;color:#fff;text-shadow:0 10px 40px #0005}
.big small{font-size:56px;color:#9fe3e3;margin-right:10px}
.st{font-size:32px;line-height:1.45;color:#d9efef;max-width:520px}
svg.path{position:absolute;left:0;top:700px;width:1080px;height:520px}
.node{position:absolute;width:210px;text-align:center}
.ic{width:120px;height:120px;margin:0 auto;border-radius:36px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px -18px #000a,0 0 0 10px #ffffff14}
.ic svg{width:60px;height:60px}
.num{position:absolute;top:-12px;right:44px;width:42px;height:42px;border-radius:50%;background:#9fe3e3;color:var(--d);font-weight:600;font-size:24px;display:flex;align-items:center;justify-content:center}
.lb{margin-top:20px;font-size:30px;font-weight:600;line-height:1.3}
.n1{right:40px;top:770px}.n2{right:300px;top:930px}.n3{left:300px;top:770px}.n4{left:40px;top:930px}
.foot{position:absolute;bottom:0;left:0;right:0;height:96px;background:#0000002a;display:flex;align-items:center;justify-content:center;gap:16px;font-size:28px;color:#e6f4f4}
.foot svg{width:30px;height:30px}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<img class="logo" src="../brand/old_logo.png">
<div class="tag">مقال · Hive Mind</div>
<div class="title">الذكاء الاصطناعي<br>في <em>رحلة المانح</em></div>
<div class="stat"><div class="big">٥<small> أضعاف</small></div><div class="st">قد تصل إليها تكلفة استقطاب مانح جديد مقارنة بالاحتفاظ بمانح حالي</div></div>
<svg class="path" viewBox="0 0 1080 520"><path d="M935 130 C 850 130, 800 300, 705 290 S 470 110, 375 130 S 210 300, 145 290" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="4" stroke-dasharray="3 14" stroke-linecap="round"/></svg>
<div class="node n1"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#0F686F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6 8l5 8M18 8l-5 8"/></svg></div><div class="num">١</div><div class="lb">رسم نقاط<br>التفاعل</div></div>
<div class="node n2"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#0F686F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20a5.5 5.5 0 0 1 11 0M13.5 20a4 4 0 0 1 8 0"/></svg></div><div class="num">٢</div><div class="lb">تصنيف حسب<br>الاهتمام</div></div>
<div class="node n3"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#0F686F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div><div class="num">٣</div><div class="lb">رسائل<br>مخصّصة</div></div>
<div class="node n4"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#0F686F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></div><div class="num">٤</div><div class="lb">متابعة<br>التفاعل</div></div>
<div class="foot"><svg viewBox="0 0 24 24" fill="none" stroke="#9fe3e3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>مع احترام خصوصية المانح في كل خطوة</div>
</body></html>
