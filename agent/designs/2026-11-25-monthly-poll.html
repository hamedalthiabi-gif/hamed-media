<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
:root{--n:#002544;--n2:#0b3a63;--c:#BB6841;--ink:#1c2a38;--mut:#5d6b78;--bg:#f6f3ef}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Ar,La;background:var(--bg);position:relative;color:var(--ink)}
.b1{position:absolute;width:900px;height:900px;left:-420px;top:-420px;border-radius:50%;background:radial-gradient(circle,#BB684122,#BB684100 70%)}
.b2{position:absolute;width:800px;height:800px;right:-360px;bottom:-320px;border-radius:50%;background:radial-gradient(circle,#0025441c,#00254400 70%)}
.top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot i{position:absolute;right:0;top:0;bottom:0;width:30%;background:var(--c)}
.logo{position:absolute;top:56px;right:80px;width:210px}
.tag{position:absolute;top:64px;left:80px;font-size:24px;font-weight:600;color:#fff;background:var(--c);border-radius:999px;padding:9px 26px;display:flex;gap:10px;align-items:center}
.tag svg{width:26px;height:26px}
.title{position:absolute;top:190px;right:80px;left:80px;font-weight:600;font-size:66px;color:var(--n);line-height:1.3}
.title em{font-style:normal;color:var(--c)}
.opts{position:absolute;top:420px;right:80px;left:80px;display:flex;flex-direction:column;gap:22px}
.o{height:104px;background:#fff;border:1.5px solid #0025441f;border-radius:26px;display:flex;align-items:center;padding:0 34px;gap:26px;box-shadow:0 18px 34px -26px #002544aa;position:relative;overflow:hidden}
.o .r{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--n)}
.o b{font-size:38px;font-weight:600;color:var(--n)}
.o .num{margin-right:auto;font-size:30px;font-weight:600;color:#fff;background:var(--n);width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.o .fill{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(270deg,#BB684114,#BB684100)}
.o.q .r{border-color:var(--c)}
.o.q .num{background:var(--c)}
.eq{position:absolute;top:960px;right:80px;left:80px;height:200px;background:var(--n);border-radius:30px;display:flex;align-items:center;padding:0 46px;gap:40px;color:#fff}
.eq svg{flex:none}
.eq .t{font-size:30px;line-height:1.55}
.eq .t b{font-family:Ar;font-weight:600;font-size:44px;color:#E9A57F}
.slog{position:absolute;top:1206px;width:100%;text-align:center;font-size:28px;font-weight:600;color:var(--c)}
.url{position:absolute;bottom:52px;width:100%;text-align:center;font-family:La,Ar;font-size:25px;color:var(--n);direction:ltr}
</style></head><body>
<div class="b1"></div><div class="b2"></div><div class="top"></div>
<img class="logo" src="../../hamed-site/logo_navy.png">
<div class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>استطلاع</div>
<div class="title">كم نسبة <em>المتبرعين الشهريين</em><br>في منظمتك؟</div>
<div class="opts">
 <div class="o"><div class="fill" style="width:22%"></div><span class="r"></span><b>أقل من ١٠٪</b><span class="num">١</span></div>
 <div class="o"><div class="fill" style="width:44%"></div><span class="r"></span><b>من ١٠٪ إلى ٢٥٪</b><span class="num">٢</span></div>
 <div class="o"><div class="fill" style="width:66%"></div><span class="r"></span><b>أكثر من ٢٥٪</b><span class="num">٣</span></div>
 <div class="o q"><span class="r"></span><b>لا نقيسها</b><span class="num">٤</span></div>
</div>
<div class="eq">
 <svg width="130" height="130" viewBox="0 0 130 130"><g transform="translate(65 65)" fill="none" stroke-width="14">
<path d="M2.7 -51.9 A52 52 0 0 1 23.6 -46.3" stroke="#BB6841"/><path d="M28.3 -43.6 A52 52 0 0 1 43.6 -28.3" stroke="#E9A57F"/><path d="M46.3 -23.6 A52 52 0 0 1 51.9 -2.7" stroke="#BB6841"/><path d="M51.9 2.7 A52 52 0 0 1 46.3 23.6" stroke="#E9A57F"/><path d="M43.6 28.3 A52 52 0 0 1 28.3 43.6" stroke="#BB6841"/><path d="M23.6 46.3 A52 52 0 0 1 2.7 51.9" stroke="#E9A57F"/><path d="M-2.7 51.9 A52 52 0 0 1 -23.6 46.3" stroke="#BB6841"/><path d="M-28.3 43.6 A52 52 0 0 1 -43.6 28.3" stroke="#E9A57F"/><path d="M-46.3 23.6 A52 52 0 0 1 -51.9 2.7" stroke="#BB6841"/><path d="M-51.9 -2.7 A52 52 0 0 1 -46.3 -23.6" stroke="#E9A57F"/><path d="M-43.6 -28.3 A52 52 0 0 1 -28.3 -43.6" stroke="#BB6841"/><path d="M-23.6 -46.3 A52 52 0 0 1 -2.7 -51.9" stroke="#E9A57F"/><text x="0" y="-2" text-anchor="middle" fill="#fff" font-size="32" font-family="Ar" font-weight="600" stroke="none">١٢</text><text x="0" y="26" text-anchor="middle" fill="#E9A57F" font-size="20" font-family="Ar" font-weight="600" stroke="none">شهرًا</text> </g></svg>
 <div class="t"><b>١٢٠٠ = ١٢ × ١٠٠</b><br>وزّع التبرع الواحد على أشهر العام</div>
</div>
<div class="slog">استدامة العطاء وأثرٌ يمتد</div>
<div class="url">hamedalthiabi.com</div>
<div class="bot"><i></i></div>
</body></html>
