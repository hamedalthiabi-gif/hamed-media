<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
:root{--n:#002544;--n2:#0b3a63;--c:#BB6841;--c2:#d0835d;--ink:#1c2a38;--mut:#5d6b78;--bg:#f6f3ef}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Ar,La;background:var(--bg);position:relative;color:var(--ink)}
.b1{position:absolute;width:780px;height:780px;right:-320px;top:-330px;border-radius:50%;background:radial-gradient(circle,#BB68412b,#BB684100 70%)}
.b2{position:absolute;width:820px;height:820px;left:-380px;bottom:-340px;border-radius:50%;background:radial-gradient(circle,#0025441f,#00254400 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#00254412 1.6px,transparent 1.6px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000 0,#0000 28%,#0000 78%,#000)}
.top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot i{position:absolute;right:0;top:0;bottom:0;width:30%;background:var(--c)}
.logo{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:220px}
.t1{position:absolute;top:186px;width:100%;text-align:center;font-weight:600;font-size:70px;line-height:1.2;color:var(--n)}
.t1 em{font-style:normal;color:var(--c)}
.free{position:absolute;top:296px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;font-size:28px;font-weight:600;padding:8px 30px;border-radius:999px;white-space:nowrap}
.gauge{position:absolute;top:372px;left:50%;transform:translateX(-50%);width:760px;height:420px}
.gauge svg{width:760px;height:420px}
.gv{position:absolute;top:806px;width:100%;text-align:center}
.gv b{display:block;font-size:44px;font-weight:600;color:var(--n);line-height:1.1}
.gv span{font-size:28px;color:var(--mut)}
.steps{position:absolute;top:910px;left:70px;right:70px;display:flex;gap:26px;justify-content:center}
.st{flex:1;background:#fff;border-radius:28px;padding:30px 18px 28px;text-align:center;box-shadow:0 18px 40px -24px #002544aa;border:1.5px solid #0025441a;position:relative}
.st .ic{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;background:var(--n);display:flex;align-items:center;justify-content:center}
.st:nth-child(2) .ic{background:linear-gradient(150deg,#d0835d,#BB6841 55%,#9c522f)}
.st .ic svg{width:44px;height:44px}
.st b{display:block;font-size:34px;font-weight:600;color:var(--n);line-height:1.3}
.st .n{position:absolute;top:-18px;right:24px;width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center}
.slog{position:absolute;top:1178px;width:100%;text-align:center;font-size:30px;font-weight:600;color:var(--n)}
.pill{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#fff;border-radius:999px;padding:10px 32px 10px 12px;box-shadow:0 14px 30px -18px #00254477;border:1.5px solid #0025441c;white-space:nowrap}
.pill .dot{width:46px;height:46px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center}
.pill .dot svg{width:26px;height:26px}
.pill span{font-family:La,Ar;font-size:28px;color:var(--n);direction:ltr}
</style></head><body>
<div class="b1"></div><div class="b2"></div><div class="dots"></div><div class="top"></div>
<img class="logo" src="../../hamed-site/logo_navy.png">
<div class="t1">قبل أن تخطط، <em>قِس</em></div>
<div class="free">مؤشر الصمود المالي · مجاني</div>

<div class="gauge"><svg viewBox="0 0 760 420" fill="none">
 <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BB6841"/><stop offset=".55" stop-color="#0b3a63"/><stop offset="1" stop-color="#002544"/></linearGradient></defs>
 <path d="M80 380 A300 300 0 0 1 680 380" stroke="#00254414" stroke-width="64" stroke-linecap="round"/>
 <path d="M80 380 A300 300 0 0 1 680 380" stroke="url(#g)" stroke-width="30" stroke-linecap="round"/>
 <g stroke="#fff" stroke-width="4" stroke-linecap="round">
  <path d="M168 168 l14 14"/><path d="M380 80 v20"/><path d="M592 168 l-14 14"/>
 </g>
 <g transform="rotate(38 380 380)"><path d="M380 380 L380 150" stroke="#002544" stroke-width="12" stroke-linecap="round"/></g>
 <circle cx="380" cy="380" r="30" fill="#002544"/><circle cx="380" cy="380" r="12" fill="#BB6841"/>
</svg></div>
<div class="gv"><b>أين تقف منظمتك؟</b></div>

<div class="steps">
 <div class="st"><div class="n">١</div><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></div><b>عشرة أسئلة</b></div>
 <div class="st"><div class="n">٢</div><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1.3"/></svg></div><b>درجة من ١٠٠</b></div>
 <div class="st"><div class="n">٣</div><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div><b>تقرير على بريدك</b></div>
</div>

<div class="slog">استدامة العطاء وأثرٌ يمتد</div>
<div class="pill"><div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></div><span>hamedalthiabi.com</span></div>
<div class="bot"><i></i></div>
</body></html>
