<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
:root{--t:#0F686F;--t2:#13858d;--ink:#243438;--mut:#5f7275;--bg:#f4f6f5}
*{margin:0;box-sizing:border-box}html{width:1080px;height:1350px;overflow:hidden}
body{width:1080px;height:1350px;font-family:Ar,La;background:var(--bg);overflow:hidden;position:relative;color:var(--ink)}
.blob{position:absolute;border-radius:50%}
.b1{width:640px;height:640px;left:-280px;top:-260px;background:radial-gradient(circle,#0F686F22,#0F686F00 70%)}
.b2{width:720px;height:720px;right:-320px;bottom:-300px;background:radial-gradient(circle,#0F686F1f,#0F686F00 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#0F686F18 1.6px,transparent 1.6px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000 0,#0000 32%,#0000 75%,#000)}
.top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,var(--t),var(--t2))}
.bot{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(90deg,var(--t),var(--t2))}
.logo{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:210px}
.eyebrow{position:absolute;top:196px;width:100%;text-align:center;font-weight:600;font-size:26px;color:var(--t2)}
.title{position:absolute;top:234px;width:100%;text-align:center;font-weight:600;font-size:68px;color:var(--t);line-height:1.2}
.sub{position:absolute;top:328px;width:100%;text-align:center;font-size:30px;color:var(--mut)}
.track{position:absolute;top:420px;left:80px;right:80px;height:720px}
.line{position:absolute;right:110px;top:70px;bottom:70px;width:6px;border-radius:6px;background:linear-gradient(180deg,#0F686F33,#0F686F,#13858d)}
.step{position:absolute;right:0;width:920px;height:200px;display:flex;align-items:center;gap:34px}
.s1{top:0}.s2{top:260px}.s3{top:520px}
.dot{width:226px;height:200px;flex:none;display:flex;align-items:center;justify-content:center}
.ic{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;
 background:#fff;border:3px solid #0F686F33;box-shadow:0 18px 36px -20px #0F686F88}
.ic svg{width:66px;height:66px}
.s2 .ic{background:radial-gradient(circle at 35% 30%,#1b8f97,#0F686F 60%,#0b5257);border:0;box-shadow:0 22px 44px -16px #0F686F99,0 0 0 14px #0F686F14,0 0 0 28px #0F686F0a}
.s3 .ic{background:linear-gradient(145deg,#15878f,#0F686F);border:0}
.card{flex:1;background:#fff;border-radius:30px;padding:30px 36px;box-shadow:0 18px 40px -22px #0F686F55;border:1.5px solid #0F686F1a}
.k{font-size:24px;font-weight:600;color:var(--t2)}
.nm{font-size:46px;font-weight:600;color:var(--t);line-height:1.15;margin-top:2px}
.d{font-size:27px;color:var(--mut);margin-top:10px;line-height:1.45}
.s2 .card{background:linear-gradient(135deg,#0F686F,#13858d);border:0}
.s2 .k{color:#cfe9ea}.s2 .nm{color:#fff}.s2 .d{color:#e6f4f4}
.pill{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:#fff;border-radius:999px;padding:16px 36px;box-shadow:0 14px 30px -18px #0F686F66;border:1.5px solid #0F686F1a;white-space:nowrap;font-size:30px;font-weight:600}
.pill svg{width:36px;height:36px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="dots"></div><div class="top"></div>
<img class="logo" src="../brand/old_logo.png">
<div class="eyebrow">تقرير يقرؤه الداعم</div>
<div class="title">قصة تغيير، لا قائمة أنشطة</div>
<div class="sub">ثلاث محطات تجعل الداعم يرى أثر عطائه</div>
<div class="track"><div class="line"></div>
<div class="step s1"><div class="dot"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#0F686F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div></div>
<div class="card"><div class="k">١ · قبل</div><div class="nm">الوضع الصعب</div><div class="d">شخص واحد، وحياته قبل التغيير</div></div></div>
<div class="step s2"><div class="dot"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-9.3-9A5.2 5.2 0 0 1 12 6.3 5.2 5.2 0 0 1 21.3 12C19 16.6 12 21 12 21z"/></svg></div></div>
<div class="card"><div class="k">٢ · لحظة التغيير</div><div class="nm">تدخّل الداعم</div><div class="d">ما الذي موّله دعمه بالتحديد؟</div></div></div>
<div class="step s3"><div class="dot"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div></div>
<div class="card"><div class="k">٣ · بعد</div><div class="nm">النتيجة الإيجابية</div><div class="d">كيف تبدو حياته اليوم؟</div></div></div>
</div>
<div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#0F686F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4v-9zM7 11l4-7a2 2 0 0 1 3 2l-1 4h5a2 2 0 0 1 2 2.4l-1.3 6A2 2 0 0 1 16.7 20H7"/></svg><span>«وبفضل متبرعين أمثالك…»</span></div>
<div class="bot"></div>
</body></html>
