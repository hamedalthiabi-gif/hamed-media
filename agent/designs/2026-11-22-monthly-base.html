<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
:root{--n:#002544;--n2:#0b3a63;--c:#BB6841;--c2:#d0835d;--ink:#1c2a38;--mut:#5d6b78;--bg:#f6f3ef}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Ar,La;background:var(--bg);position:relative;color:var(--ink)}
.b1{position:absolute;width:820px;height:820px;left:-380px;top:-380px;border-radius:50%;background:radial-gradient(circle,#BB684120,#BB684100 70%)}
.b2{position:absolute;width:760px;height:760px;right:-340px;bottom:-300px;border-radius:50%;background:radial-gradient(circle,#0025441a,#00254400 70%)}
.top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot i{position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--c)}
.logo{position:absolute;top:56px;right:80px;width:210px}
.tag{position:absolute;top:64px;left:80px;font-size:24px;font-weight:600;color:var(--c);border:2px solid var(--c);border-radius:999px;padding:7px 24px}
.title{position:absolute;top:190px;right:80px;left:80px;font-weight:600;font-size:66px;color:var(--n);line-height:1.25}
.title em{font-style:normal;color:var(--c)}
/* comparison panel */
.panel{position:absolute;top:400px;left:70px;right:70px;height:390px;background:#fff;border-radius:36px;border:1.5px solid #0025441a;box-shadow:0 30px 60px -36px #002544aa;display:flex;align-items:center;padding:0 46px}
.one{width:250px;text-align:center}
.one .blk{width:150px;height:220px;margin:0 auto;border-radius:22px;background:linear-gradient(170deg,#c9d3dd,#9fb0c1);display:flex;align-items:center;justify-content:center;color:var(--n);font-family:Ar;font-weight:600;font-size:46px}
.one p,.mon p{font-size:26px;color:var(--mut);margin-top:16px}
.arrow{width:120px;display:flex;justify-content:center}
.mon{flex:1;text-align:center}
.bars{display:flex;gap:10px;align-items:flex-end;justify-content:center;height:220px}
.bars span{width:34px;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,var(--c2),var(--c));box-shadow:0 10px 18px -10px #BB6841}
.mon .big{font-weight:600;color:var(--n);font-size:30px;margin-top:16px}
.mon .big b{color:var(--c);font-weight:600;font-size:40px;margin-left:10px}
/* steps */
.steps{position:absolute;top:840px;left:70px;right:70px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.st{display:flex;gap:20px;align-items:center;background:#ffffffb0;border-radius:26px;padding:20px 24px;border:1.5px solid #0025441a}
.st .ic{width:66px;height:66px;flex:none;border-radius:20px;background:var(--n);display:flex;align-items:center;justify-content:center}
.st .ic svg{width:34px;height:34px}
.st b{font-size:29px;font-weight:600;color:var(--n);line-height:1.3}
.slog{position:absolute;top:1190px;width:100%;text-align:center;font-size:29px;font-weight:600;color:var(--c)}
.url{position:absolute;bottom:62px;width:100%;text-align:center;font-family:La,Ar;font-size:27px;color:var(--n);direction:ltr}
</style></head><body>
<div class="b1"></div><div class="b2"></div><div class="top"></div>
<img class="logo" src="../../hamed-site/logo_navy.png">
<div class="tag">المتبرع الشهري</div>
<div class="title">كيف تبني قاعدة<br><em>متبرعيك الشهريين</em>؟</div>
<div class="panel">
 <div class="one"><div class="blk">١٬٢٠٠</div><p>تبرع لمرة واحدة</p></div>
 <div class="arrow"><svg width="96" height="40" viewBox="0 0 96 40" fill="none"><path d="M92 20H10" stroke="#BB6841" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 12"/><path d="M22 6L6 20l16 14" stroke="#BB6841" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <div class="mon">
  <div class="bars"><span style="height:80px"></span><span style="height:92px"></span><span style="height:104px"></span><span style="height:116px"></span><span style="height:128px"></span><span style="height:140px"></span><span style="height:152px"></span><span style="height:164px"></span><span style="height:176px"></span><span style="height:188px"></span><span style="height:200px"></span><span style="height:212px"></span></div>
  <div class="big"><b>١٠٠</b> كل شهر، على مدار العام</div>
 </div>
</div>
<div class="steps">
 <div class="st"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/><rect x="7" y="12" width="10" height="4" rx="2"/></svg></div><b>زر شهري في الصدارة</b></div>
 <div class="st"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg></div><b>شكر فوري لا إيصال</b></div>
 <div class="st"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/></svg></div><b>اقتطاع بنكي ثابت</b></div>
 <div class="st"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="2"/></svg></div><b>٧ لمسات في العام</b></div>
</div>
<div class="slog">استدامة العطاء وأثرٌ يمتد</div>
<div class="url">hamedalthiabi.com</div>
<div class="bot"><i></i></div>
</body></html>
