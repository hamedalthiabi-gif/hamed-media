<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
:root{--n:#002544;--n2:#0b3a63;--c:#BB6841;--c2:#d0835d;--ink:#1c2a38;--mut:#5d6b78;--bg:#f6f3ef}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Ar,La;background:var(--bg);position:relative;color:var(--ink)}
.b1{position:absolute;width:780px;height:780px;left:-320px;top:-330px;border-radius:50%;background:radial-gradient(circle,#BB68412b,#BB684100 70%)}
.b2{position:absolute;width:820px;height:820px;right:-380px;bottom:-340px;border-radius:50%;background:radial-gradient(circle,#0025441f,#00254400 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#00254412 1.6px,transparent 1.6px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000 0,#0000 26%,#0000 80%,#000)}
.top{position:absolute;top:0;left:0;right:0;height:12px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(90deg,var(--n),var(--n2))}
.bot i{position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--c)}
.logo{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:220px}
.t1{position:absolute;top:180px;width:100%;text-align:center;font-weight:600;font-size:66px;line-height:1.2;color:var(--n)}
.t1 em{font-style:normal;color:var(--c)}

.t1{top:170px;font-size:72px}
.sub{position:absolute;top:268px;width:100%;text-align:center;font-size:32px;color:var(--mut)}
.qm{position:absolute;top:340px;left:50%;transform:translateX(-50%);width:150px;height:150px;border-radius:44px;background:linear-gradient(150deg,#d0835d,#BB6841 55%,#9c522f);display:flex;align-items:center;justify-content:center;box-shadow:0 22px 40px -20px #9c522f}
.qm svg{width:84px;height:84px}
.opts{position:absolute;top:545px;left:110px;right:110px;display:flex;flex-direction:column;gap:30px}
.op{height:126px;background:#fff;border-radius:26px;border:1.5px solid #0025441c;box-shadow:0 18px 34px -24px #002544aa;display:flex;align-items:center;padding:0 34px;gap:28px;position:relative;overflow:hidden}
.ic{flex:none;width:78px;height:78px;border-radius:22px;background:var(--n);display:flex;align-items:center;justify-content:center}
.op:nth-child(2) .ic,.op:nth-child(4) .ic{background:linear-gradient(150deg,#d0835d,#BB6841 55%,#9c522f)}
.ic svg{width:42px;height:42px}
.lbl{flex:1;font-size:40px;font-weight:600;color:var(--n);white-space:nowrap}
.rad{flex:none;width:50px;height:50px;border-radius:50%;border:3px solid #00254433}
.slog{position:absolute;top:1178px;width:100%;text-align:center;font-size:30px;font-weight:600;color:var(--n)}
.pill{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#fff;border-radius:999px;padding:10px 32px 10px 12px;box-shadow:0 14px 30px -18px #00254477;border:1.5px solid #0025441c;white-space:nowrap}
.pill .dot{width:46px;height:46px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center}
.pill .dot svg{width:26px;height:26px}
.pill span{font-family:La,Ar;font-size:28px;color:var(--n);direction:ltr}
.slog{top:1180px}
</style></head><body>
<div class="b1"></div><div class="b2"></div><div class="dots"></div><div class="top"></div>
<img class="logo" src="../../hamed-site/logo_navy.png">
<div class="t1">ما أكبر <em>تحدٍّ مالي</em> لمنظمتك؟</div>
<div class="sub">اختر واحدًا، وشاركنا في الردود</div>
<div class="qm"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"><path d="M8.6 8.8a3.6 3.6 0 1 1 5.2 3.2c-1.1.6-1.8 1.4-1.8 2.7v.6"/><circle cx="12" cy="19" r=".6" fill="#fff"/></svg></div>
<div class="opts"><div class="op"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/></svg></div><div class="lbl">مصدر دخل واحد</div><div class="rad"></div></div><div class="op"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2.5-6 5-6 7.5 0s5 6 7.5 0 3.5-4 5-2"/></svg></div><div class="lbl">تذبذب الإيراد بين المواسم</div><div class="rad"></div></div><div class="op"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M19 14.8c1.4.9 2.2 2.6 2.5 5.2"/></svg></div><div class="lbl">الاحتفاظ بالمتبرعين</div><div class="rad"></div></div><div class="op"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></div><div class="lbl">تمويل التطوير والتقنية</div><div class="rad"></div></div></div>
<div class="slog">استدامة العطاء وأثرٌ يمتد</div>
<div class="pill"><div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></div><span>hamedalthiabi.com</span></div>
<div class="bot"><i></i></div>
</body></html>
