<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;src:url(../brand/plex-600.ttf);font-weight:600}
@font-face{font-family:Ar;src:url(../brand/plex-400.ttf);font-weight:400}
@font-face{font-family:La;src:url(../brand/plex-latin-400.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;position:relative;font-family:Ar,La;background:url(study-03-poll-base.png) no-repeat 0 0/1080px 1350px;color:#1c343a}
.cover{position:absolute;left:0;right:0;top:532px;height:722px;background:#f3f6f5}
.card{position:absolute;left:65px;right:65px;top:562px;height:560px;background:#fff;border-radius:34px;box-shadow:0 18px 40px rgba(15,104,111,.10);padding:42px 46px}
.hd{display:flex;align-items:center;gap:14px;font-size:27px;color:#5d7176;font-weight:400;margin-bottom:34px}
.row{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.lb{width:250px;font-size:27px;font-weight:600;color:#1c343a;text-align:right}
.tr{flex:1;height:58px;background:#eef3f2;border-radius:14px;position:relative;overflow:hidden}
.br{position:absolute;right:0;top:0;bottom:0;border-radius:14px;background:linear-gradient(90deg,#3f9a9f,#0f686f)}
.pc{width:92px;font-size:34px;font-weight:600;color:#0f686f;text-align:left;direction:ltr}
.row.top .br{background:linear-gradient(90deg,#1b8a91,#0b555b)}
.row.top .lb,.row.top .pc{color:#0b555b}
.row.no .br{background:repeating-linear-gradient(-45deg,#b9c9c9 0 10px,#a6b9ba 10px 20px)}
.row.no .lb,.row.no .pc{color:#6b7f83}
.tag{position:absolute;right:64px;top:12px;font-size:19px;color:#fff;font-weight:600}
.pill{position:absolute;left:50%;transform:translateX(-50%);top:1150px;background:#e1efed;color:#0f5c62;border-radius:40px;padding:16px 36px;font-size:27px;font-weight:600;white-space:nowrap}
.pill b{color:#0f686f}
</style></head><body>
<div class="cover"></div>
<div class="card">
 <div class="hd"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0f686f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>إجابات 370 منظمة غير ربحية</div>
 <div class="row"><div class="lb">أقل من 3 أشهر</div><div class="tr"><div class="br" style="width:65.5%"></div></div><div class="pc">19%</div></div>
 <div class="row top"><div class="lb">من 4 إلى 6 أشهر</div><div class="tr"><div class="br" style="width:100%"></div><span class="tag">الأعلى</span></div><div class="pc">29%</div></div>
 <div class="row"><div class="lb">من 7 إلى 12 شهرًا</div><div class="tr"><div class="br" style="width:75.9%"></div></div><div class="pc">22%</div></div>
 <div class="row"><div class="lb">أكثر من سنة</div><div class="tr"><div class="br" style="width:55.2%"></div></div><div class="pc">16%</div></div>
 <div class="row no"><div class="lb">لا تغطي نفقاتها أصلًا</div><div class="tr"><div class="br" style="width:48.3%"></div></div><div class="pc">14%</div></div>
</div>
<div class="pill">نحو <b>ثلث</b> المنظمات لا تصمد أكثر من 3 أشهر</div>
</body></html>
